<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">

<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="initial-scale=1.0" />
<meta name="format-detection" content="telephone=no" />
<title></title>
<style type="text/css">
body {
	width: 100%;
	margin: 0;
	padding: 0;
	-webkit-font-smoothing: antialiased;
}

@media only screen and (max-width: 600px) {
	table[class="table-row"] {
		float: none !important;
		width: 98% !important;
		padding-left: 20px !important;
		padding-right: 20px !important;
	}
	table[class="table-row-fixed"] {
		float: none !important;
		width: 98% !important;
	}
	table[class="table-col"], table[class="table-col-border"] {
		float: none !important;
		width: 100% !important;
		padding-left: 0 !important;
		padding-right: 0 !important;
		table-layout: fixed;
	}
	td[class="table-col-td"] {
		width: 100% !important;
	}
	table[class="table-col-border"]+table[class="table-col-border"] {
		padding-top: 12px;
		margin-top: 12px;
		border-top: 1px solid #E8E8E8;
	}
	table[class="table-col"]+table[class="table-col"] {
		margin-top: 15px;
	}
	td[class="table-row-td"] {
		padding-left: 0 !important;
		padding-right: 0 !important;
	}
	table[class="navbar-row"], td[class="navbar-row-td"] {
		width: 100% !important;
	}
	img {
		max-width: 100% !important;
		display: inline !important;
	}
	img[class="pull-right"] {
		float: right;
		margin-left: 11px;
		max-width: 125px !important;
		padding-bottom: 0 !important;
	}
	img[class="pull-left"] {
		float: left;
		margin-right: 11px;
		max-width: 125px !important;
		padding-bottom: 0 !important;
	}
	table[class="table-space"], table[class="header-row"] {
		float: none !important;
		width: 98% !important;
	}
	td[class="header-row-td"] {
		width: 100% !important;
	}
}

@media only screen and (max-width: 480px) {
	table[class="table-row"] {
		padding-left: 16px !important;
		padding-right: 16px !important;
	}
}

@media only screen and (max-width: 320px) {
	table[class="table-row"] {
		padding-left: 12px !important;
		padding-right: 12px !important;
	}
}

@media only screen and (max-width: 458px) {
	td[class="table-td-wrap"] {
		width: 100% !important;
	}
}
</style>
</head>

<body
	style="font-family: Arial, sans-serif; font-size: 13px; color: #444444; min-height: 200px;"
	bgcolor="#E4E6E9" leftmargin="0" topmargin="0" marginheight="0"
	marginwidth="0">



	<table class="header-row" width="378" cellspacing="0" cellpadding="0"
		border="0" style="table-layout: fixed;">
		<tbody>
			<tr>
				<td class="header-row-td" width="378"
					style="font-family: Arial, sans-serif; font-weight: normal; line-height: 19px; color: #478fca; margin: 0px; font-size: 18px; padding-bottom: 10px; padding-top: 15px;"
					valign="top" align="left"><b></b> <span th:text="${title}"></span></b></td>
			</tr>
		</tbody>
	</table>
	<div
		style="font-family: Arial, sans-serif; line-height: 20px; color: #444444; font-size: 13px;">
		Sayın <strong th:text="${firstUser}"> </strong>, <br /> Onaylamanız
		gereken 1 adet talep bulunmaktadır. <br /> <br />
		<table width="750">
			<tr>
				<td>Müşteri No</td>
				<td th:text="${kunnr}"></td>
			</tr>
			<tr>
				<td>Müşteri Adı</td>
				<td th:text="${name1}"></td>
			</tr>
			<tr>
				<td>Belge Numarası</td>
				<td th:text="${belnr}"></td>
			</tr>
			<tr>
				<td>Mevcut Vade Tarihi</td>
				<td th:text="${zfbdt}"></td>
			</tr>
			<tr>
				<td>Uzatılacak Gün Sayısı</td>
				<td th:text="${newValue}"></td>
			</tr>
			<tr>
				<td>Açıklama</td>
				<td th:text="${description}"></td>
			</tr>
			<tr>
				<td><a th:href="${okLink}">ONAYLA</a></td>
				<td><a th:href="${noLink}">REDDET</a></td>

			</tr>

		</table>
		<span>Saygılarımızla.</span>
	</div>

</body>

</html>
